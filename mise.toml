[settings]
all_compile = false

[tool_alias]
toolconfig = "github:mathematic-inc/toolconfig"

[tools]
buf = "1.75.0"
ghalint = "1.6.0"
gitleaks = "8.30.1"
hadolint = "2.15.1"
harper-cli = "3.3.0"
hk = "2.13.0"
jactionlint = "2.6.0"
lychee = "0.24.2"
node = "26.13.1"
oxfmt = { version = "0.79.0", depends = ["node"] }
oxlint = { version = "1.94.0", depends = ["node"] }
pinact = "5.0.2"
python = "3.15.2"
ruff = "0.17.5"
rumdl = "0.3.5"
rust = { version = "1.100.0", profile = "minimal", components = "rustfmt" }
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.11.3"
toolconfig = "2026.11.6"
ty = "0.0.107"
typos = "1.52.2"
zizmor = "1.32.0"
"aqua:EmbarkStudios/cargo-deny" = { version = "0.21.0", depends = ["rust"] }
"aqua:apple/pkl" = "0.33.1"
"aqua:owenlamont/ryl" = "0.30.0"
"github:mongodb/kingfisher" = "2.19.1"
"npm:knip" = { version = "6.46.1", depends = ["node"] }
"npm:oxlint-tsgolint" = { version = "7.0.2007", depends = ["node"] }

[tasks.check]
description = "Check the profile, the fixture consumers and this repository"
run = [
  "toolconfig check --strict",
  "python -m unittest discover --start-directory tests --verbose",
  "hk check --all --slow",
]
