[settings]
all_compile = false

[tool_alias]
toolconfig = "github:mathematic-inc/toolconfig"

[tools]
buf = "1.75.0"
ghalint = "1.6.0"
gitleaks = "8.30.1"
hadolint = "2.15.1"
harper-cli = "3.0.0"
hk = "2.11.1"
jactionlint = "2.5.0"
jq = "1.8.2"
lychee = "0.24.2"
node = "26.13.0"
oxfmt = { version = "0.77.0", depends = ["node"] }
oxlint = { version = "1.92.0", depends = ["node"] }
pinact = "5.0.2"
python = "3.15.2"
ruff = "0.17.4"
rumdl = "0.3.2"
rust = { version = "1.99.1", profile = "minimal", components = "rustfmt" }
shellcheck = "0.11.0"
shfmt = "3.14.1"
tombi = "1.10.0"
toolconfig = { version = "2026.11.4", version_prefix = "v" }
ty = "0.0.107"
typos = "1.52.0"
zizmor = "1.32.0"
"aqua:EmbarkStudios/cargo-deny" = { version = "0.20.2", depends = ["rust"] }
"aqua:anordal/shellharden" = "4.3.2"
"aqua:apple/pkl" = "0.33.0"
"aqua:owenlamont/ryl" = "0.29.0"
"github:mongodb/kingfisher" = "2.17.0"
"npm:knip" = { version = "6.44.2", depends = ["node"] }
"npm:oxlint-tsgolint" = { version = "7.0.2006", depends = ["node"] }

[tasks.generate]
description = "Generate the tool settings of this repository"
run = "toolconfig generate --strict"

[tasks.check]
description = "Check the profile, the fixture consumers and this repository"
run = [
  "toolconfig check --strict",
  "toolconfig generate --strict",
  "python -m unittest discover --start-directory tests --verbose",
  "hk check --all --slow",
]
